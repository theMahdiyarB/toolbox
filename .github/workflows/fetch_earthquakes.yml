name: Fetch IRSC Earthquake Data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch XML from IRSC
        run: |
          mkdir -p data
          curl -f --max-time 15 \
               -H "Host: irsc.ut.ac.ir" \
               http://80.66.177.64/events_list_fa.xml \
               -o data/earthquakes.xml
          echo "Fetched $(wc -c < data/earthquakes.xml) bytes"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update earthquakes.xml [skip ci]"
          git push